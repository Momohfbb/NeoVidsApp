name = "neovids-backend"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Secrets (set with `npx wrangler secret put NAME`, never commit them):
#   OWNER_KEY        your personal key: unlimited use, no daily quota (enter it in the app Settings)
#   APP_TOKEN        optional shared token the app sends in `x-app-token`
#   FAL_KEY          fal.ai key
#   REPLICATE_TOKEN  Replicate API token
#   LUMA_KEY         Luma Dream Machine key
#
# Optional plain variables:
[vars]
FREE_DAILY_VIDEOS = "3"   # public users, per device per day
FREE_DAILY_IMAGES = "10"
PROVIDER_ORDER = "fal,replicate,luma,cf"
FREE_DAILY_ASSISTS = "40"  # AI prompt helper uses, per device per day

# Cloudflare Workers AI: smart prompts (translate + enhance) and free image generation (provider "cf").
# Free tier: 10,000 neurons per day on the Cloudflare account.
[ai]
binding = "AI"
