name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_backendUrl: ${{ vars.BACKEND_URL }}
      ORG_GRADLE_PROJECT_appToken: ${{ secrets.APP_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: NeoVids-AI-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK as "latest" release (direct phone download)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: NeoVids AI (latest build)
          make_latest: true
          files: app/build/outputs/apk/debug/app-debug.apk
