name: Build APK

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ORG_GRADLE_PROJECT_backendUrl: ${{ vars.BACKEND_URL }}
      ORG_GRADLE_PROJECT_appToken: ${{ secrets.APP_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug APK
        run: ./gradlew testDebugUnitTest assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: NeoVids-AI-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Signed release APK + Play bundle (only when signing secrets exist)
        id: release
        if: github.ref == 'refs/heads/main'
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "No signing secrets yet; skipping release build (see docs/publishing.md)."
            exit 0
          fi
          printf '%s' "$KEYSTORE_BASE64" | base64 -d > release.keystore
          ./gradlew assembleRelease bundleRelease --stacktrace
          cp app/build/outputs/apk/release/app-release.apk NeoVids-release.apk
          cp app/build/outputs/bundle/release/app-release.aab NeoVids-release.aab
          rm -f release.keystore
          echo "signed=1" >> "$GITHUB_OUTPUT"

      - name: Publish signed release files
        if: github.ref == 'refs/heads/main' && steps.release.outputs.signed == '1'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          files: |
            NeoVids-release.apk
            NeoVids-release.aab

      - name: Publish APK as "latest" release (direct phone download)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: NeoVids AI (latest build)
          make_latest: true
          files: app/build/outputs/apk/debug/app-debug.apk
