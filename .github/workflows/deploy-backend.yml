name: Deploy backend

# Deploys backend/ to Cloudflare Workers whenever it changes on main (or on demand).
# One-time setup: add these as secrets of the GitHub environment "neo"
# (Settings -> Environments -> neo -> Add environment secret) or as repository secrets:
#   CLOUDFLARE_API_TOKEN   (template "Edit Cloudflare Workers")
#   CLOUDFLARE_ACCOUNT_ID  (optional if the token belongs to a single account)
#   FAL_KEY or REPLICATE_TOKEN or LUMA_KEY   (at least one)
#   OWNER_KEY              (your personal key: unlimited use; enter it in the app Settings)
#   APP_TOKEN              (optional, recommended; use the same value for the app build)

on:
  push:
    branches: [main]
    paths: ["backend/**", ".github/workflows/deploy-backend.yml"]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Reads secrets stored in the GitHub environment "neo" (repository-level secrets work too).
    environment: neo
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - name: Check Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::CLOUDFLARE_API_TOKEN not set; skipping deploy."
            echo "SKIP=1" >> "$GITHUB_ENV"
          fi

      - uses: actions/setup-node@v4
        if: env.SKIP != '1'
        with:
          node-version: 20

      - name: Deploy worker and provider secrets
        if: env.SKIP != '1'
        working-directory: backend
        env:
          FAL_KEY: ${{ secrets.FAL_KEY }}
          REPLICATE_TOKEN: ${{ secrets.REPLICATE_TOKEN }}
          LUMA_KEY: ${{ secrets.LUMA_KEY }}
          APP_TOKEN: ${{ secrets.APP_TOKEN }}
          OWNER_KEY: ${{ secrets.OWNER_KEY }}
        run: |
          # CLOUDFLARE_ACCOUNT_ID is optional: with a single-account token, wrangler finds the account itself.
          [ -z "$CLOUDFLARE_ACCOUNT_ID" ] && unset CLOUDFLARE_ACCOUNT_ID
          # Pasted secrets often carry a trailing space or newline, which breaks HTTP headers: strip whitespace.
          # If the whole "curl ... -H 'Authorization: Bearer <token>'" sample from Cloudflare was pasted, keep only the token.
          if printf '%s' "$CLOUDFLARE_API_TOKEN" | grep -qE 'Bearer[[:space:]]+[A-Za-z0-9_-]+'; then
            CLOUDFLARE_API_TOKEN=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | grep -oE 'Bearer[[:space:]]+[A-Za-z0-9_-]+' | head -1 | awk '{print $2}')
          fi
          CLOUDFLARE_API_TOKEN=$(printf '%s' "$CLOUDFLARE_API_TOKEN" | tr -d '[:space:]')
          export CLOUDFLARE_API_TOKEN
          if [ -n "${CLOUDFLARE_ACCOUNT_ID:-}" ]; then
            CLOUDFLARE_ACCOUNT_ID=$(printf '%s' "$CLOUDFLARE_ACCOUNT_ID" | tr -d '[:space:]')
            export CLOUDFLARE_ACCOUNT_ID
          fi
          if printf '%s' "$CLOUDFLARE_API_TOKEN" | LC_ALL=C grep -q '[^ -~]'; then
            echo "::error::CLOUDFLARE_API_TOKEN contains characters that are not valid in a token (non-ASCII). Re-create the secret and paste only the token."
            exit 1
          fi
          npm install --no-audit --no-fund
          npm test
          # Diagnose the token before deploying (prints Cloudflare's answer, never the token itself).
          echo "Token length: ${#CLOUDFLARE_API_TOKEN}"
          curl -sS https://api.cloudflare.com/client/v4/user/tokens/verify -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" | tee /tmp/verify.json | head -c 600; echo
          grep -q '"success":true' /tmp/verify.json || { echo "::error::Cloudflare rejected CLOUDFLARE_API_TOKEN. Create a new token (template: Edit Cloudflare Workers) and replace the secret."; exit 1; }
          # Daily quotas for public users need a KV namespace; create it once, best effort.
          # (wrangler prefixes the title with the worker name, so match on "contains".)
          find_kv() {
            npx wrangler kv namespace list 2>/dev/null > /tmp/kvlist.txt || true
            node -e 'const s=require("fs").readFileSync("/tmp/kvlist.txt","utf8");const m=s.match(/\[\s*\{[\s\S]*\}\s*\]/);try{const a=JSON.parse(m[0]);const n=a.find(x=>String(x.title).includes("neovids-quota"));console.log(n?n.id:"")}catch(e){console.log("")}'
          }
          ID=$(find_kv)
          if [ -z "$ID" ]; then
            npx wrangler kv namespace create neovids-quota > /tmp/kv.txt 2>&1 || true
            ID=$(find_kv)
            if [ -z "$ID" ]; then sed 's/[0-9a-f]\{32\}/<id>/g' /tmp/kv.txt | tail -8; head -c 300 /tmp/kvlist.txt | sed 's/[0-9a-f]\{32\}/<id>/g'; fi
          fi
          if [ -n "$ID" ]; then
            printf '\n[[kv_namespaces]]\nbinding = "QUOTA"\nid = "%s"\n' "$ID" >> wrangler.toml
          else
            echo "::warning::Could not set up the QUOTA KV namespace; daily limits will not be enforced."
          fi
          npx wrangler deploy
          for name in FAL_KEY REPLICATE_TOKEN LUMA_KEY APP_TOKEN OWNER_KEY; do
            value="${!name}"
            if [ -n "$value" ]; then
              printf '%s' "$value" | npx wrangler secret put "$name"
            fi
          done
